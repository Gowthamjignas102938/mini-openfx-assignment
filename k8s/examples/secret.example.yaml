# TEMPLATE ONLY. Placeholder values, safe to commit. DO NOT fill in real values here.
#
# This lives in k8s/examples/ on purpose: `kubectl apply -f k8s/` doesn't read
# subfolders, so this placeholder can never overwrite the real Secret.
#
# Create the REAL Secret from the git-ignored k8s/.env.k8s file instead
# (see k8s/README.md):
#   kubectl create secret generic openfx-secrets -n openfx --from-env-file=k8s/.env.k8s
#
# A Secret works like a ConfigMap but is meant for sensitive values. Kubernetes
# keeps it separate and can restrict who can read it. (Note: the values are only
# base64-encoded, not encrypted, so never commit a real one.)
apiVersion: v1
kind: Secret
metadata:
  name: openfx-secrets        # the name the Deployment, Job and Postgres read from
  namespace: openfx
type: Opaque                  # "Opaque" = generic, free-form key/value secret
stringData:                   # stringData lets you write plain text; k8s encodes it for you
  # Shared key clients must send in the X-API-Key header on every /v1/* call
  API_KEY: "change-me"
  # Password Postgres is initialised with
  POSTGRES_PASSWORD: "change-me"
  # Full connection string the app uses. "postgres" is the Postgres Service name.
  DATABASE_URL: "postgresql://postgres:change-me@postgres:5432/miniopenfx"
